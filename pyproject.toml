[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanplan"
version = "0.1.0"
description = "Phone captures to dimensioned, stitched floor plans with damage scope and calibrated intervals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "shapely>=2.0",
  "jsonschema>=4.18",
  "pillow>=10",
  "pillow-heif>=0.16",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
models = ["torch>=2.4,<2.10", "torchvision>=0.19,<0.25", "transformers>=4.40,<5", "huggingface-hub>=0.23,<1"]
# bench/damage_appearance.py and scripts/fetch_bd3.py only -- the appearance-classifier
# BENCHMARK, which is not wired into the pipeline. Optional on purpose: the LiDAR tier must
# stay lean and offline, and nothing under scanplan/ imports sklearn. pyarrow is NOT optional
# within this extra: both files read BD3's parquet via pandas, pandas declares no parquet
# engine of its own, and nothing else in this project pulls one in transitively -- without it
# both documented commands die on "Unable to find a usable engine".
# Install with: pip install -e '.[damage]'
damage = ["scikit-learn>=1.3", "pyarrow>=14"]

[project.scripts]
scanplan = "scanplan.cli:main"

[tool.setuptools.packages.find]
include = ["scanplan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
